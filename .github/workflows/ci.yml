name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: wapp-dam clear examples/wapp4/orders_hivernage.csv examples/wapp4/atc_hivernage.csv --price-max 1300 --out /tmp/out
      - run: python examples/scenarios.py
